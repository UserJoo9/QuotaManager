services:
  quota-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: quota-manager:latest
    container_name: quota-manager
    # Host networking is required for kernel-level nftables NAT, traffic shaping (tc),
    # ARP scanning, DHCP broadcasts (UDP 67), and DNS (UDP 53).
    # Note: 'ports:' mapping is omitted because under network_mode: host,
    # the container shares the host network stack directly.
    network_mode: host
    # Privileged mode gives the container NET_ADMIN / NET_RAW permissions to program
    # the kernel firewall, routing table, and traffic queues.
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Africa/Cairo}
      - QUOTA_CONFIG=/app/config.yaml
      - QUOTA_PORT=${QUOTA_PORT:-8080}
      - PYTHONUNBUFFERED=1
      # Gateway Network Settings (Optional overrides - defaults shown)
      # - LAN_IF=eth0
      # - CLIENT_IP=192.168.2.1
      # - CLIENT_NET=192.168.2.0/24
      # - POOL_START=192.168.2.100
      # - POOL_END=192.168.2.200
      # - WAN_GATEWAY=192.168.1.1
      # - UPSTREAM_DNS=8.8.8.8
    volumes:
      # Mount config.yaml from host for in-place edits without image rebuilds
      - ./config.yaml:/app/config.yaml:rw
      # Persistent SQLite database (allowances, users, devices, daily usage)
      - ./data:/var/lib/quota-gateway:rw
      # Persistent application logs
      - ./logs:/var/log/quota-gateway:rw
      # Persistent DNS filter rules and tags generated by the dashboard
      - ./dnsmasq.d:/etc/dnsmasq.d:rw
      # Persistent DHCP lease tracking
      - ./leases:/var/lib/misc:rw
