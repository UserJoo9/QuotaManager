# Quota Manager — Linux gateway configuration (Kali/Debian laptop).
# The kernel owns the network path: dnsmasq (DHCP+DNS) + nftables NAT/accounting.
# Clients live on a SEPARATE subnet (192.168.2.0/24, gateway = this laptop) so
# every byte deterministically crosses the box — no proxy_arp.
# Values match the defaults baked into scripts/setup_gateway_kali.sh.
#
#   python3 run.py --config config-linux.yaml

bundle:
  total_gb: 200.0        # <- change to your monthly bundle
  reset_day: 0           # day of month the ISP resets; 0 = never auto-reset

db_path: /var/lib/quota-gateway/quota.db
log_file: /var/log/quota-gateway/quota.log
log_level: INFO
timezone: ""             # empty = system local timezone

dhcp:
  enable: true
  interface: ""          # auto-detected by dnsmasq via the setup script
  # Clients' gateway = this laptop. On the Linux gateway it must be the
  # CLIENT-SUBNET address (192.168.2.1), not the uplink IP: dnsmasq hands it
  # out as option 3 (default gateway) + option 6 (DNS).
  gateway_ip: 192.168.2.1
  router_ip: 192.168.1.1      # upstream ISP router
  dns_servers: [192.168.1.1, 8.8.8.8]
  dns_forward: true
  subnet: 255.255.255.0
  pool_start: 192.168.2.100   # first address handed to devices
  pool_end: 192.168.2.200     # last address handed to devices
  lease_hours: 24
  lease_file: /var/lib/misc/dnsmasq.leases
  # Electric-cut fallback: give the ROUTER a small DHCP pool (gateway = router)
  # so devices stay online while this laptop is down. On Linux dnsmasq only
  # serves 192.168.2.x, so a router pool on 192.168.1.201-250 can never overlap.
  # fallback_enabled: true
  # fallback_pool_start: 192.168.1.201
  # fallback_pool_end: 192.168.1.250

engine:
  enabled: true
  backend: nftables      # nftables on Linux / windivert on Windows / auto
  count_direction: inbound
  table: quota_gateway

# Proxy-ARP is not needed on Linux: clients are on their own subnet whose
# gateway is this box's real address (masquerade NAT does the rest), so the
# scapy responder stays off.
arp:
  enabled: false
  interface: ""
  announce_interval_sec: 60

web:
  host: 0.0.0.0
  port: 8080
