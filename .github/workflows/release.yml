# Quota Manager — build a .deb and publish it to GitHub Releases.
#
# The .deb is built and released ONLY from this workflow. Triggered by pushing a
# version tag (v<major>.<minor>.<patch>, e.g. `git tag v0.1.0 && git push --tags`).
# The released version is the single source of truth in quota/version.py; the tag
# must match it (the workflow fails loudly if they drift, so a tag can never ship
# the wrong version).
#
# GitHub Releases are immutable: pushing a second tag with the same name is
# rejected by GitHub. The `latest` release is the newest tag (softprops sets it
# via generated tags unless `make_latest` is 'false').

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the Release + attach the .deb asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is the single source of truth in quota/version.py. Import it
      # so the package metadata, the .deb filename and the Release all agree.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Import quota/version directly (it pulls no deps) instead of
          # regex-parsing the file — a regex with quote-char classes like
          # [\"'] breaks out of the -c "..." shell quoting (the first live
          # run failed with a Python SyntaxError for exactly that reason).
          VER=$(python3 -c "import sys; sys.path.insert(0,'.'); from quota.version import __version__; print(__version__)")
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "v${VER}" ]; then
            echo "::error::tag '$TAG' does not match quota/version.py version '$VER' (expected tag 'v$VER')"
            exit 1
          fi
          echo "version=$VER"
          echo "tag=$TAG"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Render the Debian control file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Strip the template's #-comment lines: Debian control files cannot
          # contain comments, and dpkg-deb rejects any line starting with '#'.
          sed -e "s/__VERSION__/${VERSION}/g" -e '/^#/d' packaging/DEBIAN/control.template > "${RUNNER_TEMP}/control"
          # A control file is not valid Debian without a changelog entry for the
          # version it ships; render one so metadata, changelog and .deb agree.
          # (printf, not a heredoc — a heredoc inside a workflow run block breaks
          # the YAML parser.)
          printf 'quota-manager (%s) stable; urgency=medium\n\n  * Linux-only metered-internet quota gateway.\n\n -- Quota Manager Maintainer <noreply@github.com>  Tue, 05 Aug 2026 00:00:00 +0000\n' \
              "${VERSION}" > "${RUNNER_TEMP}/changelog"

      - name: Stage package payload
        run: |
          STAGE="${RUNNER_TEMP}/stage"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/quota-manager"
          cp "${RUNNER_TEMP}/control"    "$STAGE/DEBIAN/control"
          cp "${RUNNER_TEMP}/changelog"  "$STAGE/DEBIAN/changelog"
          cp packaging/DEBIAN/postinst   "$STAGE/DEBIAN/postinst"
          cp packaging/DEBIAN/prerm      "$STAGE/DEBIAN/prerm"
          # The runtime payload. Explicit allowlist — build/junk that lives in
          # the repo must never ship.
          cp run.py requirements-linux.txt LICENSE "$STAGE/opt/quota-manager/"
          cp -r core quota api web scripts "$STAGE/opt/quota-manager/"
          # Scripts are only useful with executable bits; dpkg preserves them.
          # Name the lifecycle scripts explicitly — a *install glob never
          # matches "postinst" (and an unmatched glob fails under -e).
          chmod 755 "$STAGE/DEBIAN/postinst" "$STAGE/DEBIAN/prerm" "$STAGE/opt/quota-manager/scripts"/*.sh
          # No source-control noise on the box.
          rm -rf "$STAGE/opt/quota-manager/api/__pycache__" "$STAGE/opt/quota-manager/core/__pycache__" \
                 "$STAGE/opt/quota-manager/quota/__pycache__" "$STAGE/opt/quota-manager/web/__pycache__" \
                 "$STAGE/opt/quota-manager/scripts/__pycache__"

      - name: Build .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          dpkg-deb --build --root-owner-group "${RUNNER_TEMP}/stage" "dist/quota-manager_${VERSION}_all.deb"

      - name: Inspect the artifact (sanity)
        run: |
          dpkg-deb --info "dist/quota-manager_${{ steps.version.outputs.version }}_all.deb"
          dpkg-deb --contents "dist/quota-manager_${{ steps.version.outputs.version }}_all.deb" | head -40

      # The release description = a short install note + this version's
      # CHANGELOG section (from "## [<ver>]" up to the next top-level "## ["
      # header; "###" sub-headings stay). Keeps the release notes in sync with
      # CHANGELOG.md automatically — the file is the single source of truth.
      - name: Compose release notes (install note + CHANGELOG)
        id: release_body
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          { printf 'Quota Manager **v%s**.\n\n' "${VER}"
            printf 'Install on the gateway laptop:\n\n'
            printf '```bash\nsudo apt install ./quota-manager_%s_all.deb\n```\n\n' "${VER}"
            printf 'The package configures the network stack, installs the Python\n'
            printf 'dependencies into `/opt/quota-manager/.venv`, wires the\n'
            printf '`quota-gateway` systemd service and starts it. See the README for\n'
            printf 'the post-install router steps (disable DHCP, disable IPv6/RA).\n\n'
            printf -- '---\n\n'
            awk -v ver="${VER}" '
              /^## / { if (insec) exit }
              index($0, "## [" ver "]") { insec = 1; next }
              insec { print }
            ' CHANGELOG.md
          } > "${RUNNER_TEMP}/release_body.md"
          echo "body_path=${RUNNER_TEMP}/release_body.md" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quota-manager_*.deb
          body_path: ${{ steps.release_body.outputs.body_path }}
