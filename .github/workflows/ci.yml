name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.agents/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-linux.txt'

      - name: Install system dependencies (nftables, iproute2, dnsmasq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2 dnsmasq arp-scan

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pytest-timeout

      - name: Run linter (pyflakes)
        run: |
          pyflakes api core quota tests run.py

      - name: Run test suite (pytest)
        env:
          PYTHONPATH: .
        run: |
          pytest -v --timeout=60
