name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.agents/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-linux.txt'

      - name: Install system dependencies (nftables, iproute2, dnsmasq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2 dnsmasq arp-scan

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pytest-timeout

      - name: Run linter (pyflakes)
        run: |
          pyflakes api core quota tests run.py

      - name: Run test suite (pytest)
        env:
          PYTHONPATH: .
        run: |
          pytest -v --timeout=60

  frontend:
    name: Dashboard (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install (exact lockfile)
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      # The gateway serves the committed web/app build (no Node on the box), so the
      # committed files must be exactly what this source builds to.
      - name: Committed build is up to date
        working-directory: .
        run: |
          git add -N web/app
          git diff --stat --exit-code -- web/index.html web/app || {
            echo "::error::web/app is stale - run 'cd frontend && npm run build' and commit the result"; exit 1; }
