  svg{color:var(--text-tertiary)}
  h1{font-size:19px;margin:12px 0 6px}

  .ar{direction:rtl;font-family:"QM Arabic",var(--font)}
  a{display:inline-flex;margin-top:16px;height:38px;align-items:center;padding:0 18px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
